# Checks on every push and pull request of the migrated app. legacy/ and analysis-local/ are private and absent here:
# run evidence checks that need them (parity --check-files, visual scores) locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Types, lint, format, unit tests, build, UI checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: python -m pip install pypdf
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
        env:
          # The report tests run PYTHON (else "python"): the runner image sets PYTHON to another interpreter.
          PYTHON: ${{ steps.python.outputs.python-path }}
      - run: npx vite build
      - run: npm run smoke:prod
      - run: npm run ui:check
      # Add once they exist: the parity gate (without --check-files) and the click-through flows.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  native:
    name: Rust (fmt, clippy, tests)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vite build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml
