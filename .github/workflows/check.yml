name: Toolkit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.13']
        include:
          - os: windows-latest
            python-version: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pillow
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Linux'
        run: sh -n templates/agent/pre-commit

  windows-odbc-export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyodbc
      - name: ODBC export against a real driver
        run: python tests\windows_e2e\odbc_e2e.py ${{ runner.temp }}\odbc
